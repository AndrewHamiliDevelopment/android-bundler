services:
  nginx-output:
    image: nginx:alpine
    container_name: nginx-output
    ports:
      - "${OUTPUT_PORT}:80"
    volumes:
      - ./output:/var/www/output:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
  android-bundler:
    build: .
    container_name: android-bundler
    volumes:
      - ./project:/workspace/project
      - ./output:/workspace/output
      - ./.gradle-cache:/root/.gradle
    environment:
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - BUILD_TYPE=${BUILD_TYPE}
      - RUN_GRADLE_CLEAN=${RUN_GRADLE_CLEAN:-false}
      - RESET_GRADLE_TRANSFORMS_CACHE=${RESET_GRADLE_TRANSFORMS_CACHE:-false}
      - EXCLUDE_NATIVE_CLEAN_TASKS=${EXCLUDE_NATIVE_CLEAN_TASKS:-true}
      - JKS_PATH=${JKS_PATH}
      - JKS_ALIAS=${JKS_ALIAS}
      - JKS_PASSWORD=${JKS_PASSWORD}
      - JKS_KEY_PASSWORD=${JKS_KEY_PASSWORD}
    working_dir: /workspace
    command: ["/workspace/build.sh"]
